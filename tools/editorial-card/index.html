/* ---------- 4. text helpers ---------- */
const FONT_KO = '"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", system-ui, sans-serif';
const FONT_EN = '"Helvetica Neue", Helvetica, "Segoe UI", Arial, "Liberation Sans", system-ui, sans-serif';

function hasHangul(s) { return /[\u1100-\u11FF\u3131-\u318E\uAC00-\uD7A3]/.test(s || ""); }
function hasLatin(s) { return /[A-Za-z]/.test(s || ""); }

function fontFor(text) {
  // Latin headline → condensed editorial sans; Hangul → heavy Korean sans
  return hasHangul(text) && !hasLatin(text) ? FONT_KO : (hasHangul(text) ? FONT_KO : FONT_EN);
}
function setFont(ctx, family, weight, size) {
  ctx.font = weight + " " + size + "px " + family;
}
function setTracking(ctx, px) {
  try { ctx.letterSpacing = px + "px"; } catch (e) { /* older engines: no-op */ }
}

// "[accent]" syntax → runs
function parseRuns(str) {
  const runs = [];
  let hl = false, buf = "";
  for (const ch of (str || "")) {
    if (ch === "[" || ch === "【") { if (buf) runs.push({ t: buf, hl }); buf = ""; hl = true; }
    else if (ch === "]" || ch === "】") { if (buf) runs.push({ t: buf, hl }); buf = ""; hl = false; }
    else buf += ch;
  }
  if (buf) runs.push({ t: buf, hl });
  if (!runs.length) runs.push({ t: "", hl: false });
  return runs;
}
function plain(str) { return (str || "").replace(/[\[\]【】]/g, ""); }

// split runs into breakable atoms: CJK chars alone, latin words+trailing space, spaces alone
function atomsOf(runs) {
  const out = [];
  for (const r of runs) {
    const toks = r.t.match(/[\u3131-\u318E\u4E00-\u9FFF\uFF01-\uFF60]|[^\s\u3131-\u318E\u4E00-\u9FFF\uFF01-\uFF60]+|\s+/g) || [];
    for (const t of toks) out.push({ t, hl: r.hl });
  }
  return out;
}
function wrapAtoms(ctx, atoms, maxW) {
  const lines = [];
  let cur = [], curW = 0, lastSpace = -1;
  const w = a => ctx.measureText(a.t).width;
  for (const a of atoms) {
    const aw = w(a);
    const isSpace = /^\s+$/.test(a.t);
    if (cur.length && curW + aw > maxW) {
      if (lastSpace >= 0 && lastSpace < cur.length - 1) {
        const head = cur.slice(0, lastSpace + 1);
        const tail = cur.slice(lastSpace + 1);
        lines.push(head);
        cur = tail;
        curW = tail.reduce((s, x) => s + w(x), 0);
        lastSpace = -1;
        for (let i = 0; i < cur.length; i++) if (/^\s+$/.test(cur[i].t)) lastSpace = i;
      } else {
        lines.push(cur);
        cur = []; curW = 0; lastSpace = -1;
      }
    }
    cur.push(a); curW += aw;
    if (isSpace) lastSpace = cur.length - 1;
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function runsOfLine(line) {
  const out = [];
  for (const a of line) {
    if (out.length && out[out.length - 1].hl === a.hl) out[out.length - 1].t += a.t;
    else out.push({ t: a.t, hl: a.hl });
  }
  return out.map(r => ({ t: r.t.replace(/\s+$/, ""), hl: r.hl })).filter(r => r.t.length);
}
// shrink font size until the block fits
function fitHeadline(ctx, text, maxW, maxH, startSize, minSize, lineGap, tracking, scaleX) {
  const family = fontFor(text);
  const atoms = atomsOf(parseRuns(text));
  const weight = hasHangul(text) ? 800 : 800;
  let size = startSize, best = null;
  const inner = maxW / (scaleX || 1);
  while (size >= minSize) {
    setFont(ctx, family, weight, size);
    setTracking(ctx, tracking * size);
    const lines = wrapAtoms(ctx, atoms, inner);
    const lh = size * lineGap;
    best = { size, lines, lh, family, tracking: tracking * size };
    if (lines.length * lh <= maxH && lines.length <= 5) return best;
    size -= Math.max(2, Math.round(size * 0.045));
  }
  return best;
}
function drawLine(ctx, lineRuns, x, y, size, opts) {
  const scaleX = opts.scaleX || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scaleX, 1);
  setFont(ctx, opts.family, opts.weight || 800, size);
  setTracking(ctx, opts.tracking || 0);
  let cx = 0;
  for (const r of lineRuns) {
    ctx.fillStyle = r.hl ? opts.accent : opts.color;
    ctx.fillText(r.t, cx, 0);
    cx += ctx.measureText(r.t).width;
  }
  ctx.restore();
}
function drawTextBlock(ctx, block, x, topY, opts) {
  const size = block.size, lh = block.lh;
  let y = topY + size * 0.86;
  const out = [];
  for (const line of block.lines) {
    const runs = runsOfLine(line);
    drawLine(ctx, runs, x, y, size, {
      family: block.family,
      tracking: block.tracking,
      scaleX: opts.scaleX,
      accent: opts.accent,
      color: opts.color
    });
    y += lh;
  }
  out.push(y - lh + size * 0.05);
  return y - lh + size * 0.05; // bottom of last line
}
function blockHeight(block) { return block.lines.length * block.lh; }

function drawTag(ctx, text, x, y, opts) {

  const size = opts.size, weight = opts.weight || 700;
  ctx.save();
  setFont(ctx, opts.family || FONT_EN, weight, size);
  setTracking(ctx, opts.tracking || size * 0.18);
  ctx.fillStyle = opts.color;
  ctx.textAlign = opts.align || "left";
  ctx.textBaseline = "alphabetic";

  ctx.fillText(t, x, y);

  ctx.restore();

}

/* ---------- 5. background painting ---------- */
let noiseCv = null;
function noisePattern(ctx) {
  if (!noiseCv) {
    noiseCv = document.createElement("canvas");
    noiseCv.width = noiseCv.height = 180;
    const c = noiseCv.getContext("2d");
    const d = c.createImageData(180, 180);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = 128 + (Math.random() * 2 - 1) * 120;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
      d.data[i + 3] = Math.random() * 40;
    }
    c.putImageData(d, 0, 0);
  }
  return ctx.createPattern(noiseCv, "repeat");
}
function addGrain(ctx, W, H, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const p = noisePattern(ctx);
  ctx.fillStyle = p;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function vignette(ctx, W, H, strength) {
  const rg = ctx.createRadialGradient(W / 2, H * 0.44, W * 0.22, W / 2, H * 0.44, W * 0.98);
  rg.addColorStop(0, "rgba(0,0,0,0)");
  rg.addColorStop(1, "rgba(0,0,0," + (0.30 * strength).toFixed(3) + ")");
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);
}
function drawPhoto(ctx, img, W, H, s) {
  const zoom = (s.zoom || 100) / 100;
  const scale = Math.max(W / img.width, H / img.height) * zoom;
  const dw = img.width * scale, dh = img.height * scale;
  const dx = (W - dw) / 2;
  const dy = (H - dh) * ((s.py == null ? 50 : s.py) / 100);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}
function drawGradient(ctx, s, W, H) {
  const g = GRADS[s.grad] || GRADS.noir;
  const lg = ctx.createLinearGradient(0, 0, W * 0.78, H);
  lg.addColorStop(0, g.c[0]);
  lg.addColorStop(0.55, g.c[1]);
  lg.addColorStop(1, g.c[2]);
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const blobs = [
    { x: W * 0.16, y: H * 0.14, r: W * 0.66, c: g.g[0] },
    { x: W * 0.93, y: H * 0.70, r: W * 0.58, c: g.g[1] }
  ];
  for (const b of blobs) {
    const rg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    rg.addColorStop(0, b.c);
    rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  // editorial geometry: thin concentric arcs, off-canvas right
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.055)";
  ctx.lineWidth = Math.max(1.5, W * 0.0018);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(W * 1.06, H * 0.30, W * (0.46 + i * 0.20), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  vignette(ctx, W, H, 0.9);
}

/* ---------- 6. layout blocks ---------- */
function makeBlock(ctx, text, o) {
  const family = o.family || fontFor(text);
  const size = o.size;
  const tracking = (o.tracking || 0) * size;
  const lh = size * (o.lineGap || 1.45);
  setFont(ctx, family, o.weight || 500, size);
  setTracking(ctx, tracking);
  const lines = wrapAtoms(ctx, atomsOf(parseRuns(text)), o.maxW);
  setTracking(ctx, 0);
  return { size, lh, family, tracking, lines, weight: o.weight || 500 };
}
function blockHeight(b) { return b.lines.length * b.lh; }
function drawTextBlock(ctx, block, x, topY, opts) {
  const o = opts || {};
  const scaleX = o.scaleX || 1;
  let y = topY + block.size * 0.80;
  for (const line of block.lines) {
    drawLine(ctx, runsOfLine(line), x, y, block.size, {
      family: block.family,
      tracking: block.tracking,
      scaleX: scaleX,
      accent: o.accent || "#fff",
      color: o.color || "#fff",
      weight: block.weight

    y += block.lh;
  }
  return topY + block.lh * block.lines.length;
}
function fitBlock(ctx, text, o) {
  const hangul = hasHangul(text);

  const trackingEm = hangul ? -0.010 : -0.022;
  const lineGap = hangul ? 1.17 : 1.045;
  const inner = o.maxW / scaleX;

  while (size >= o.min) {
    best = makeBlock(ctx, text, { family, size, weight: 800, tracking: trackingEm, maxW: inner, lineGap });
    if (best.lines.length * best.lh <= o.maxH && best.lines.length <= (o.maxLines || 4)) break;
    size -= Math.max(2, Math.round(size * 0.05));
  }
  best.scaleX = scaleX;
  return best;
}
function drawBadge(ctx, text, x, baseline, size, accent, align) {
  if (!text) return;
  const sq = size * 0.60;
  const label = hasHangul(text) ? text : text.toUpperCase();
  ctx.save();
  setFont(ctx, fontFor(text), 800, size);
  setTracking(ctx, size * 0.17);
  const tw = ctx.measureText(label).width;
  let bx = x;
  if (align === "right") bx = x - (tw + sq + size * 0.5);
  ctx.fillStyle = accent;
  ctx.fillRect(bx, baseline - sq * 0.94, sq, sq);
  ctx.fillStyle = "rgba(255,255,255,0.94)";
  ctx.fillText(label, bx + sq + size * 0.5, baseline);
  ctx.restore();
  setTracking(ctx, 0);
}

/* ---------- 7. layouts ---------- */
function layoutMagazine(ctx, s, W, H) {
  const pad = W * 0.072;
  const sc = (s.scrim == null ? 60 : s.scrim) / 100;
  const gTop = H * 0.30;
  const lg = ctx.createLinearGradient(0, gTop, 0, H);
  lg.addColorStop(0, "rgba(0,0,0,0)");
  lg.addColorStop(0.42, "rgba(0,0,0," + (0.10 + 0.40 * sc).toFixed(3) + ")");
  lg.addColorStop(1, "rgba(0,0,0," + (0.60 + 0.36 * sc).toFixed(3) + ")");
  ctx.fillStyle = lg;
  ctx.fillRect(0, gTop, W, H - gTop);

  const tg = ctx.createLinearGradient(0, 0, 0, H * 0.20);
  tg.addColorStop(0, "rgba(0,0,0," + (0.20 + 0.26 * sc).toFixed(3) + ")");
  tg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, H * 0.20);

  const srcBase = H - pad * 0.55;
  let cursor = srcBase - (s.source ? pad * 0.92 : 0);
  if (s.sub) {
    const sub = makeBlock(ctx, s.sub, { size: W * 0.0295, weight: 500, maxW: W - pad * 2.1, lineGap: 1.48 });
    cursor -= blockHeight(sub);
    drawTextBlock(ctx, sub, pad, cursor, { color: "rgba(255,255,255,0.86)", accent: state.accent });
  }
  const head = fitBlock(ctx, s.headline || " ", { start: W * 0.098, min: W * 0.050, maxW: W - pad * 2, maxH: H * 0.315, maxLines: 3 });
  const headTop = cursor - pad * 0.34 - blockHeight(head);
  drawTextBlock(ctx, head, pad, headTop, { color: "#ffffff", accent: state.accent, scaleX: head.scaleX });

  if (s.badge) drawBadge(ctx, s.badge, pad, headTop - pad * 0.42, W * 0.0225, state.accent);

  if (s.source) {
    drawTag(ctx, s.source, pad, srcBase, { size: W * 0.0205, color: "rgba(255,255,255,0.52)", tracking: W * 0.0042, weight: 600 });
  }
}

function layoutQuote(ctx, s, W, H) {
  const pad = W * 0.072;
  const sc = (s.scrim == null ? 60 : s.scrim) / 100;
  const lg = ctx.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, "rgba(0,0,0," + (0.42 + 0.36 * sc).toFixed(3) + ")");
  lg.addColorStop(0.55, "rgba(0,0,0," + (0.14 + 0.30 * sc).toFixed(3) + ")");
  lg.addColorStop(1, "rgba(0,0,0," + (0.34 + 0.36 * sc).toFixed(3) + ")");
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, W, H);

  // oversized quote mark
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = state.accent;
  ctx.font = "700 " + (W * 0.20).toFixed(1) + "px Georgia, 'Times New Roman', serif";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("\u201C", pad * 0.86, H * 0.118 + W * 0.075);
  ctx.restore();

  if (s.badge) drawBadge(ctx, s.badge, W - pad, pad * 1.05, W * 0.0215, state.accent, "right");

  const headTop = H * 0.175;
  const head = fitBlock(ctx, s.headline || " ", { start: W * 0.104, min: W * 0.052, maxW: W - pad * 2, maxH: H * 0.40, maxLines: 5 });
  const headBottom = drawTextBlock(ctx, head, pad, headTop, { color: "#ffffff", accent: state.accent, scaleX: head.scaleX });

  const ruleY = headBottom + pad * 0.46;
  ctx.fillStyle = state.accent;
  ctx.fillRect(pad, ruleY, W * 0.12, Math.max(2, W * 0.0032));

  if (s.sub) {
    const sub = makeBlock(ctx, s.sub, { size: W * 0.0295, weight: 500, maxW: W - pad * 2.1, lineGap: 1.5 });
    const subTop = ruleY + pad * 0.42;
    if (subTop + blockHeight(sub) < H - pad) {
      drawTextBlock(ctx, sub, pad, subTop, { color: "rgba(255,255,255,0.86)", accent: state.accent });
    }
  }
  if (s.source) {
    drawTag(ctx, s.source, pad, H - pad * 0.8, { size: W * 0.0195, color: "rgba(255,255,255,0.50)", tracking: W * 0.0038, weight: 600 });
  }
}

function layoutBreaking(ctx, s, W, H) {
  const pad = W * 0.072;
  const sc = (s.scrim == null ? 60 : s.scrim) / 100;
  ctx.fillStyle = "rgba(0,0,0," + (0.06 + 0.26 * sc).toFixed(3) + ")";
  ctx.fillRect(0, 0, W, H);

  const bandTop = H * 0.600;
  const fg = ctx.createLinearGradient(0, bandTop - H * 0.10, 0, bandTop);
  fg.addColorStop(0, "rgba(7,7,9,0)");
  fg.addColorStop(1, "rgba(7,7,9,0.94)");
  ctx.fillStyle = fg;
  ctx.fillRect(0, bandTop - H * 0.10, W, H * 0.10);
  ctx.fillStyle = "rgba(7,7,9,0.93)";
  ctx.fillRect(0, bandTop, W, H - bandTop);
  ctx.fillStyle = state.accent;
  ctx.fillRect(0, bandTop - 3, W, Math.max(3, W * 0.0035));

  // top breaking bar
  const barH = Math.max(44, W * 0.064);
  ctx.fillStyle = state.accent;
  ctx.fillRect(0, 0, W, barH);
  const label = s.badge || (state.lang === "ko" ? "속보" : "BREAKING");
  ctx.save();
  setFont(ctx, fontFor(label), 800, barH * 0.42);
  setTracking(ctx, barH * 0.10);
  ctx.fillStyle = "rgba(9,9,11,0.92)";
  ctx.textBaseline = "middle";
  ctx.fillText(hasHangul(label) ? label : label.toUpperCase(), pad, barH * 0.54);
  ctx.restore();
  setTracking(ctx, 0);

  const headTop = bandTop + pad * 0.62;
  const head = fitBlock(ctx, s.headline || " ", { start: W * 0.086, min: W * 0.046, maxW: W - pad * 2, maxH: H * 0.236, maxLines: 3 });
  const headBottom = drawTextBlock(ctx, head, pad, headTop, { color: "#ffffff", accent: state.accent, scaleX: head.scaleX });

  if (s.sub) {
    const sub = makeBlock(ctx, s.sub, { size: W * 0.028, weight: 500, maxW: W - pad * 2.1, lineGap: 1.45 });
    const subTop = headBottom + pad * 0.34;
    if (subTop + blockHeight(sub) < H - pad * 0.9) {
      drawTextBlock(ctx, sub, pad, subTop, { color: "rgba(255,255,255,0.74)", accent: state.accent });
    }
  }
  if (s.source) {
    drawTag(ctx, s.source, W - pad, H - pad * 0.42, { size: W * 0.0185, color: "rgba(255,255,255,0.46)", tracking: W * 0.0036, weight: 600, align: "right" });
  }
}

function layoutSplit(ctx, s, W, H) {
  const pad = W * 0.072;
  const splitY = H * 0.575;
  const pg = ctx.createLinearGradient(0, splitY, 0, H);
  pg.addColorStop(0, "#101013");
  pg.addColorStop(1, "#060607");
  ctx.fillStyle = pg;
  ctx.fillRect(0, splitY, W, H - splitY);
  ctx.fillStyle = state.accent;
  ctx.fillRect(0, splitY - Math.max(3, W * 0.0035), W, Math.max(3, W * 0.0035));

  if (s.badge) drawBadge(ctx, s.badge, pad, splitY + pad * 0.86, W * 0.0215, state.accent);

  const headTop = splitY + pad * (s.badge ? 1.5 : 0.9);
  const head = fitBlock(ctx, s.headline || " ", { start: W * 0.086, min: W * 0.046, maxW: W - pad * 2, maxH: H * 0.20, maxLines: 3 });
  const headBottom = drawTextBlock(ctx, head, pad, headTop, { color: "#ffffff", accent: state.accent, scaleX: head.scaleX });

  if (s.sub) {
    const sub = makeBlock(ctx, s.sub, { size: W * 0.0275, weight: 500, maxW: W - pad * 2.1, lineGap: 1.45 });
    const subTop = headBottom + pad * 0.30;
    if (subTop + blockHeight(sub) < H - pad * 0.8) {
      drawTextBlock(ctx, sub, pad, subTop, { color: "rgba(255,255,255,0.70)", accent: state.accent });
    }
  }
  if (s.source) {
    drawTag(ctx, s.source, pad, H - pad * 0.42, { size: W * 0.0185, color: "rgba(255,255,255,0.42)", tracking: W * 0.0036, weight: 600 });
  }
}

/* ---------- 8. render entry ---------- */
const LAYOUT_FN = { magazine: layoutMagazine, quote: layoutQuote, breaking: layoutBreaking, split: layoutSplit };
function renderSlide(canvas, s, W, H) {
  canvas.width = Math.round(W);
  canvas.height = Math.round(H);
  const ctx = canvas.getContext("2d");
  ctx.save();
  ctx.fillStyle = "#050506";
  ctx.fillRect(0, 0, W, H);

  const split = s.layout === "split";
  const bgH = split ? H * 0.575 : H;
  if (s.bgType === "photo" && s.img) {
    drawPhoto(ctx, s.img, W, bgH, s);
    vignette(ctx, W, bgH, (s.scrim == null ? 60 : s.scrim) / 100);
  } else {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, bgH); ctx.clip();
    drawGradient(ctx, s, W, bgH);
    ctx.restore();
  }

  const fn = LAYOUT_FN[s.layout] || layoutMagazine;
  fn(ctx, s, W, H);

  if (s.grain) addGrain(ctx, W, H, 0.07);
  ctx.restore();
}

/* ---------- 12. photo ---------- */
async function setPhoto(file) {
  if (!file || !/^image\//.test(file.type || "")) return;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("image decode failed"));
      im.src = url;
    });
    const targets = $("#applyAll").checked ? state.slides : [S()];
    targets.forEach(s => { s.img = img; s.imgName = file.name || "pasted"; s.bgType = "photo"; });
    if (file.size > 12 * 1024 * 1024) toast(D().warnBig);
    syncBg();
    schedule();
  } catch (e) {
    toast(String(e.message || e));
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
}

function slugify(t) {

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// minimal store-only ZIP (no library, works offline)
function zipStore(files) {
  const enc = new TextEncoder();
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  const parts = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, f.data.length, true);
    lh.setUint32(22, f.data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, f.data.length, true);
    ch.setUint32(24, f.data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true);
    ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + f.data.length;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(4, 0, true);
  eo.setUint16(6, 0, true);
  eo.setUint16(8, files.length, true);
  eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true);
  eo.setUint32(16, offset, true);
  eo.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(eo.buffer)], { type: "application/zip" });
}

    const g = GRADS[k];
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.grad = k;
    b.style.background = "linear-gradient(158deg, " + g.c[0] + ", " + g.c[1] + " 56%, " + g.c[2] + ")";
    const sp = document.createElement("span");
    sp.textContent = g[state.lang] || g.en;
    b.appendChild(sp);
    b.addEventListener("click", () => { const s = S(); s.grad = k; s.bgType = "grad"; syncBg(); schedule(); });
    wrap.appendChild(b);
  });
}
function buildPresets() {
  const wrap = $("#presets");
  wrap.innerHTML = "";
  LAYOUTS.forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.layout = k;
    b.innerHTML = PRE_ICON[k] + '<em data-i18n="layout' + k.charAt(0).toUpperCase() + k.slice(1) + '"></em>';
    b.addEventListener("click", () => { S().layout = k; syncFields(); schedule(); });
    wrap.appendChild(b);
  });
}

/* ---------- 15. wiring ---------- */
function cloneSlide(s, blank) {
  const n = Object.assign({}, s);
  n.id = newId();
  if (blank) {
    n.headline = "";
    n.sub = "";
    n.source = "";
    n.badge = "PART 0" + Math.min(9, state.slides.length + 1);
  }
  return n;
}
function addSlide(blank) {
  if (state.slides.length >= 6) { toast(D().toastMax); return; }
  state.slides.push(cloneSlide(S(), blank));
  state.active = state.slides.length - 1;
  buildStrip();
  syncFields();
  renderAll();
}
function deleteSlide() {
  if (state.slides.length <= 1) { toast(D().toastMin); return; }
  state.slides.splice(state.active, 1);
  if (state.active >= state.slides.length) state.active = state.slides.length - 1;
  buildStrip();
  syncFields();
  renderAll();
}
function go(delta) {
  const n = state.slides.length;
  state.active = (state.active + delta + n) % n;
  syncFields();
  renderAll();
}

function init() {
  loadSamples("en");
  state.lang = "en";
  buildGradients();
  buildPresets();
  applyLang("en");
  buildStrip();
  syncFields();
  renderAll();

  // language + theme
  $$("#langSeg button").forEach(b => b.addEventListener("click", () => { if (b.dataset.lang !== state.lang) applyLang(b.dataset.lang); }));
  $("#themeBtn").addEventListener("click", () => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = state.theme;
    $("#themeIco").textContent = state.theme === "dark" ? "☾" : "☀";
  });

  // copy fields
  ["headline", "sub", "badge", "source"].forEach(k => {
    const el = $("#" + k);
    el.addEventListener("input", () => { S()[k] = el.value; schedule(); });
  });

  // sliders / toggles
  $("#scrim").addEventListener("input", e => { S().scrim = +e.target.value; $("#scrimV").textContent = e.target.value + "%"; schedule(); });
  $("#zoom").addEventListener("input", e => { S().zoom = +e.target.value; $("#zoomV").textContent = (e.target.value / 100).toFixed(2) + "×"; schedule(); });
  $("#py").addEventListener("input", e => { S().py = +e.target.value; $("#pyV").textContent = e.target.value + "%"; schedule(); });
  $("#grain").addEventListener("change", e => { S().grain = e.target.checked; schedule(); });

  // background tabs + accents + ratios
  $$("[data-bg]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.bg;
    if (t === "photo" && !S().img) return;
    S().bgType = t;
    syncBg();
    schedule();
  }));
  $$("#accents button").forEach(b => b.addEventListener("click", () => {
    state.accent = b.dataset.accent;
    syncFields();
    schedule();
  }));
  $$("#ratios button").forEach(b => b.addEventListener("click", () => {
    state.ratio = b.dataset.ratio;
    syncFields();
    renderAll();
  }));

  // slide actions
  $("#addBtn").addEventListener("click", () => addSlide(true));
  $("#dupBtn").addEventListener("click", () => addSlide(false));
  $("#delBtn").addEventListener("click", deleteSlide);
  $("#leftBtn").addEventListener("click", () => go(-1));
  $("#rightBtn").addEventListener("click", () => go(1));

  // photo input
  const file = $("#file");
  const drop = $("#drop");
  drop.addEventListener("click", () => file.click());
  file.addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) setPhoto(f); file.value = ""; });
  [drop, $("#canvasWrap")].forEach(el => {
    el.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    el.addEventListener("dragleave", () => drop.classList.remove("over"));
    el.addEventListener("drop", e => {
      e.preventDefault();
      drop.classList.remove("over");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setPhoto(f);
    });
  });
  window.addEventListener("paste", e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.type && it.type.indexOf("image/") === 0) {
        const f = it.getAsFile();
        if (f) { e.preventDefault(); setPhoto(f); }
        break;
      }
    }
  });

  // keyboard
  window.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  });

  // export
  $("#exportOne").addEventListener("click", async () => {
    const d = dims();
    const i = state.active;
    const c = canvasFor(i);
    const b = await blobOf(c);
    const name = String(i + 1).padStart(2, "0") + "-" + slugify(state.slides[i].headline) + "-" + d[0] + "x" + d[1] + ".png";
    saveBlob(b, name);
    toast(D().toastExport);
  });
  $("#exportAll").addEventListener("click", async () => {
    const btn = $("#exportAll");
    const lab = btn.querySelector("span");
    if (btn.disabled) return;
    btn.disabled = true;
    const d = dims();
    const files = [];
    try {
      for (let i = 0; i < state.slides.length; i++) {
        lab.textContent = (state.lang === "ko" ? "만드는 중 " : "Rendering ") + (i + 1) + "/" + state.slides.length;
        await new Promise(r => setTimeout(r, 0));
        const b = await blobOf(canvasFor(i));
        const buf = new Uint8Array(await b.arrayBuffer());
        files.push({ name: String(i + 1).padStart(2, "0") + "-" + slugify(state.slides[i].headline) + "-" + d[0] + "x" + d[1] + ".png", data: buf });
      }
      saveBlob(zipStore(files), "editorial-carousel-" + d[0] + "x" + d[1] + "-" + files.length + "slides.zip");
      toast(D().toastZip.replace("{n}", files.length));
    } catch (e) {
      toast(String((e && e.message) || e));
    } finally {
      btn.disabled = false;
      lab.textContent = I18N[state.lang].exportAll;
    }
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
